<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practicas</title>
</head>
<body>
    <!-- Título -->
    <h1 id="titulo-principal">Práctica de selección del DOM</h1>
    <!-- Párrafos -->
    <h2>Información</h2>
    <p class="parrafo">Este es el primer párrafo.</p>
    <p class="parrafo">Este es el segundo párrafo.</p>
    <p class="parrafo destacado">Este es el tercer párrafo destacado.</p>
    <!-- Imágenes -->
    <h2>Imágenes</h2>
    <img
        id="imagen-1"
        class="imagen"
        src="https://picsum.photos/200/120?random=1"
        alt="Primera imagen">
    <img
        id="imagen-2"
        class="imagen"
        src="https://picsum.photos/200/120?random=2"
        alt="Segunda imagen">
    <img
        id="imagen-3"
        class="imagen destacada"
        src="https://picsum.photos/200/120?random=3"
        alt="Tercera imagen">
    <!-- Botones -->
    <h2>Botones</h2>
    <button id="boton-guardar" class="boton">Guardar</button>
    <button id="boton-eliminar" class="boton">Eliminar</button>
    <button id="boton-enviar" class="boton importante">Enviar</button>
    <!-- Otros elementos con diferentes clases -->
    <div id="contenedor" class="contenedor">
        <p class="texto">
            Este párrafo está dentro del contenedor.
        </p>
        <p class="texto especial">
            Este párrafo tiene dos clases.
        </p>
    </div>
    <script src="index.js"></script>
</body>
</html>
