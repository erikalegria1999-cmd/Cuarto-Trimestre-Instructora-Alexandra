<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departamentos</title>
</head>
<body>
    <h1>Departamentos de la empresa</h1>
    <label for="nombre">Nombre del departamento</label>
    <input type="text" 
    id="nombre">
    <br><br>
    <label for="responsable">Responsable</label>
    <input type="text" 
    id="responsable">
    <br><br>
    <label for="empleados">Número de empleados</label>
    <input type="number" 
    id="empleados">
    <br><br>
    <label for="ubicacion">Ubicación</label>
    <input type="text" 
    id="ubicacion">
    <br><br>
    <label for="imagen">URL de la imagen</label>
    <input type="text" 
    id="imagen">
    <br><br>
    <button onclick="guardar()">Guardar departamento</button>
    <button onclick="verDepartamentos()">Ver departamentos</button>
    <div id="contenedor"></div>

    <script src="index.js"></script>
</body>
</html>
